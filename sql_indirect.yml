---
- name: Azure indirect node counting test (ClayCorps SQL databases)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Enumerate SQL databases on the claycorps server
      azure.azcollection.azure_rm_resource_info:
        resource_group: ClayCorps
        provider: Sql
        resource_type: servers
        resource_name: claycorps
        subresource:
          - type: databases
      register: sql_dbs

    - name: Report how many SQL databases were found
      ansible.builtin.debug:
        msg: "Found {{ sql_dbs.response | length }} SQL database(s) — these should register as indirect nodes"

    # Padding tasks: indirect-node processing is deferred until a job emits >=10
    # events (awx.main.tasks.host_indirect batching threshold). These no-op
    # debug tasks push the event count over the threshold so the azure_rm
    # response event is processed immediately rather than on the periodic sweep.
    - name: Generate events to cross the indirect-processing threshold
      ansible.builtin.debug:
        msg: "event padding {{ item }}"
      loop: "{{ range(1, 15) | list }}"
